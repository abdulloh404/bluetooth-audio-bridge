[workspace]
members = ["crates/daemon", "crates/cli", "crates/audio-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync"] }
toml = "0.9.12"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
